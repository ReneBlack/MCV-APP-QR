<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12356b">
    <title>Registrar retiro · MCV Almacén</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #152b4a;
        background: #f4f6fa;
        font-synthesis: none;
        --brand: #12356b;
        --brand-hover: #0c2751;
        --muted: #59677b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; }
      .page { width: min(100% - 32px, 480px); margin: 0 auto; padding: 20px 0 28px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
      .brand-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; color: white; background: var(--brand); }
      .card { padding: 30px 26px 26px; background: white; border: 1px solid #dce3ed; border-radius: 22px; box-shadow: 0 8px 32px #152b4a0a; }
      .eyebrow { display: inline-block; margin: 0 0 14px; padding: 6px 10px; border-radius: 6px; background: #eaf0f9; color: #254b7a; font-size: 11px; font-weight: 750; letter-spacing: .035em; }
      h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 34px); line-height: 1.12; letter-spacing: -.035em; }
      .intro { margin: 0 0 28px; color: var(--muted); font-size: 16px; line-height: 1.55; }
      fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
      .field { margin-bottom: 22px; }
      label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 650; }
      input, textarea { display: block; width: 100%; padding: 13px 14px; border: 1px solid #8293a8; border-radius: 10px; background: #fff; color: #152b4a; font: inherit; font-size: 16px; line-height: 1.45; transition: border-color .15s, box-shadow .15s; }
      input::placeholder, textarea::placeholder { color: #65748a; opacity: 1; }
      textarea { min-height: 112px; resize: vertical; }
      input:focus, textarea:focus { border-color: var(--brand); outline: 3px solid #2b67ae; outline-offset: 2px; }
      .help { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      button { display: flex; justify-content: center; align-items: center; gap: 9px; width: 100%; min-height: 52px; margin: 4px 0 0; padding: 13px 18px; border: 0; border-radius: 11px; background: var(--brand); color: white; font: inherit; font-size: 16px; font-weight: 650; cursor: pointer; touch-action: manipulation; }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 3px solid #2b67ae; outline-offset: 3px; }
      button:disabled { background: #586f92; cursor: wait; }
      fieldset:disabled input, fieldset:disabled textarea { background: #f4f6fa; color: #59677b; }
      .spinner { width: 17px; height: 17px; border: 2px solid #ffffff55; border-top-color: white; border-radius: 50%; animation: spin .75s linear infinite; }
      .spinner[hidden] { display: none; }
      .automatic { display: flex; justify-content: center; align-items: flex-start; gap: 6px; margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; }
      .automatic svg { flex: 0 0 15px; margin-top: 1px; }
      .notice { margin: 0; border-radius: 10px; font-size: 14px; line-height: 1.5; }
      .notice:not(:empty) { margin-bottom: 20px; padding: 13px 14px; }
      .notice.success { color: #134c36; background: #edf8ef; border: 1px solid #b8d8c2; }
      .notice.error { color: #8c2929; background: #fff2ef; border: 1px solid #e9b6ad; }
      .footer { margin: 20px 12px 0; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
      noscript p { padding: 14px; border: 1px solid #e9b6ad; border-radius: 10px; color: #8c2929; background: #fff2ef; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
      @media (max-width: 360px) { .page { width: min(100% - 24px, 480px); padding-top: 16px; } .card { padding: 24px 20px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.25l8 4.5"/></svg>
        </span>
        Almacén del taller
      </div>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Registro MCV Almacén</p>
        <h1 id="page-title">¿Qué retiraste?</h1>
        <p class="intro">Anota tu nombre y lo que sacaste del almacén.</p>
        <noscript><p>Activa JavaScript en tu navegador para registrar el retiro.</p></noscript>
        <p id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></p>
        <form id="withdrawal-form">
          <fieldset id="fields">
            <div class="field">
              <label for="name">Tu nombre</label>
              <input id="name" name="name" type="text" placeholder="Ej.: Ana Pérez" autocomplete="name" maxlength="100" required>
            </div>
            <div class="field">
              <label for="item">¿Qué sacaste?</label>
              <textarea id="item" name="item" placeholder="Ej.: 2 cajas de guantes" maxlength="500" aria-describedby="item-help" required></textarea>
              <p id="item-help" class="help">Incluye la cantidad si corresponde.</p>
            </div>
            <button id="submit-button" type="submit">
              <span id="spinner" class="spinner" aria-hidden="true" hidden></span>
              <span id="button-label">Registrar retiro</span>
            </button>
          </fieldset>
          <p class="automatic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            La fecha y la hora se guardan automáticamente.
          </p>
        </form>
      </section>
      <p class="footer">Gracias por dejar registrado lo que retiras.</p>
    </main>
    <script>
      (function () {
        'use strict';

        var form = document.getElementById('withdrawal-form');
        var fields = document.getElementById('fields');
        var nameInput = document.getElementById('name');
        var itemInput = document.getElementById('item');
        var notice = document.getElementById('notice');
        var buttonLabel = document.getElementById('button-label');
        var spinner = document.getElementById('spinner');
        var pending = false;
        var requestId = null;

        function createRequestId() {
          if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return window.crypto.randomUUID();
          }
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (letter) {
            var number;
            if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
              number = window.crypto.getRandomValues(new Uint8Array(1))[0] & 15;
            } else {
              number = Math.floor(Math.random() * 16);
            }
            return (letter === 'x' ? number : (number & 3) | 8).toString(16);
          });
        }

        function showNotice(message, type) {
          notice.className = 'notice ' + type;
          notice.setAttribute('role', type === 'error' ? 'alert' : 'status');
          notice.textContent = message;
        }

        function setPending(value) {
          pending = value;
          fields.disabled = value;
          form.setAttribute('aria-busy', String(value));
          spinner.hidden = !value;
          buttonLabel.textContent = value ? 'Guardando…' : 'Registrar retiro';
        }

        function onFailure(error) {
          setPending(false);
          var detail = error && typeof error.message === 'string' ? error.message : '';
          showNotice(detail || 'No pudimos confirmar el registro. Comprueba tu conexión e inténtalo de nuevo.', 'error');
        }

        function onSuccess(result) {
          if (!result || result.ok !== true) {
            onFailure();
            return;
          }
          setPending(false);
          requestId = null;
          itemInput.value = '';
          var timestamp = typeof result.registeredAt === 'string' ? ' ' + result.registeredAt + '.' : '';
          showNotice('Retiro registrado.' + timestamp + ' Gracias.', 'success');
          itemInput.focus();
        }

        [nameInput, itemInput].forEach(function (input) {
          input.addEventListener('input', function () {
            input.setCustomValidity('');
            // Una edición representa un retiro distinto; reintentar sin editar conserva su identificador.
            if (!pending) requestId = null;
          });
        });

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          if (pending) return;

          nameInput.setCustomValidity(nameInput.value.trim() ? '' : 'Escribe tu nombre.');
          itemInput.setCustomValidity(itemInput.value.trim() ? '' : 'Indica qué retiraste.');
          if (!form.reportValidity()) return;

          requestId = requestId || createRequestId();
          var payload = { name: nameInput.value.trim(), item: itemInput.value.trim(), requestId: requestId };
          showNotice('', '');
          setPending(true);

          try {
            if (!window.google || !window.google.script || !window.google.script.run) {
              throw new Error('No se pudo conectar con el registro. Vuelve a abrir el enlace del QR e inténtalo de nuevo.');
            }
            google.script.run
              .withSuccessHandler(onSuccess)
              .withFailureHandler(onFailure)
              .registerWithdrawal(payload);
          } catch (error) {
            onFailure(error);
          }
        });
      })();
    </script>
  </body>
</html>
